name: sig-compare

on:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: clone reactos
        run: git clone --depth 1 https://github.com/reactos/reactos.git /tmp/ros

      - name: fetch decomp
        env:
          GH_TOKEN: ${{ secrets.OUT_TOKEN }}
        run: |
          mkdir -p /tmp/dec
          for i in 0 1 2 3; do
            curl -sL -H "Authorization: token $GH_TOKEN" \
              "https://raw.githubusercontent.com/ylh440104/nt-dump-out/main/decomp_$i.c" \
              -o /tmp/dec/decomp_$i.c
          done
          ls -l /tmp/dec

      - name: compare
        env:
          GH_TOKEN: ${{ secrets.OUT_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64
          import glob
          import json
          import os
          import re
          import urllib.request

          TOKEN = os.environ["GH_TOKEN"]
          DST = "ylh440104/nt-dump-out"

          def nparams(sig):
              s = sig.strip()
              if not s or s == "void":
                  return 0
              depth = 0
              n = 1
              for ch in s:
                  if ch in "([":
                      depth += 1
                  elif ch in ")]":
                      depth -= 1
                  elif ch == "," and depth == 0:
                      n += 1
              return n

          nt = {}
          for path in sorted(glob.glob("/tmp/dec/decomp_*.c")):
              lines = open(path, encoding="utf-8", errors="replace").read().splitlines()
              for i, line in enumerate(lines):
                  m = re.match(r"^===== (\S+) @ ", line)
                  if not m:
                      continue
                  name = m.group(1)
                  for j in range(i + 1, min(i + 6, len(lines))):
                      d = re.match(r"^[\w\*]+\s+" + re.escape(name) + r"\((.*)\)\s*$", lines[j])
                      if d:
                          nt[name] = nparams(d.group(1))
                          break
                      d2 = re.match(r"^" + re.escape(name) + r"\((.*)\)\s*$", lines[j])
                      if d2:
                          nt[name] = nparams(d2.group(1))
                          break
          print("nt functions:", len(nt))

          ros = {}
          for root, dirs, files in os.walk("/tmp/ros/ntoskrnl"):
              for fn in files:
                  if not fn.endswith(".c"):
                      continue
                  try:
                      lines = open(os.path.join(root, fn), encoding="utf-8",
                                   errors="replace").read().splitlines()
                  except Exception:
                      continue
                  for i, line in enumerate(lines):
                      m = re.match(r"^([A-Z][A-Za-z0-9_]{2,})\(", line)
                      if not m:
                          continue
                      name = m.group(1)
                      buf = line[len(name) + 1:]
                      k = i
                      while ")" not in buf and k + 1 < len(lines) and k - i < 15:
                          k += 1
                          buf += " " + lines[k].strip()
                      if ")" in buf:
                          buf = buf[:buf.rindex(")")]
                          ros[name] = nparams(buf)
          print("ros functions:", len(ros))

          both = sorted(set(nt) & set(ros))
          same = [n for n in both if nt[n] == ros[n]]
          diff = [n for n in both if nt[n] != ros[n]]
          print("same name:", len(both), "same sig:", len(same), "diff sig:", len(diff))

          rows = ["status\tname\tnt_params\tros_params"]
          for n in same:
              rows.append("SAME\t%s\t%d\t%d" % (n, nt[n], ros[n]))
          for n in diff:
              rows.append("DIFF\t%s\t%d\t%d" % (n, nt[n], ros[n]))

          content = "\n".join(rows) + "\n"
          body = {"message": "signature compare", "branch": "main",
                  "content": base64.b64encode(content.encode()).decode()}
          url = "https://api.github.com/repos/%s/contents/_meta/sig_compare.tsv" % DST
          hdr = {"Authorization": "token " + TOKEN, "User-Agent": "sig"}
          try:
              req = urllib.request.Request(url, headers=hdr)
              with urllib.request.urlopen(req, timeout=60) as r:
                  body["sha"] = json.loads(r.read())["sha"]
          except Exception:
              pass
          req = urllib.request.Request(url, data=json.dumps(body).encode(),
                                       method="PUT",
                                       headers=dict(hdr, **{"Content-Type": "application/json"}))
          with urllib.request.urlopen(req, timeout=120) as r:
              print("pushed", r.status, len(rows) - 1)
          PY