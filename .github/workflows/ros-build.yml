name: ros-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - name: install ninja
        run: choco install -y ninja

      - name: install flex bison
        run: |
          curl.exe -O https://svn.reactos.org/storage/vperevertkin/flexbison.7z
          7z x flexbison.7z -o"${{ github.workspace }}\bin" -y
          echo "${{ github.workspace }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "BISON_PKGDATADIR=${{ github.workspace }}\bin\share\bison" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "M4=${{ github.workspace }}\bin\m4.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: clone reactos
        run: git clone --depth 1 https://github.com/reactos/reactos.git src

      - name: overlay ob
        shell: bash
        run: |
          cd src
          curl -sL https://raw.githubusercontent.com/ylh440104/nt-dump-runner/main/src/ntoskrnl/ob/obref.c -o ntoskrnl/ob/obref.c
          wc -l ntoskrnl/ob/obref.c
          grep -c OBJECT_HEADER_CORRUPTION ntoskrnl/ob/obref.c

      - name: activate msvc
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86
          toolset: '14'

      - name: configure
        run: |
          cmake -S src -B build -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE:FILEPATH=toolchain-msvc.cmake `
            -DARCH:STRING=i386 `
            -DCMAKE_BUILD_TYPE:STRING=Debug `
            -DDLL_EXPORT_VERSION:STRING=0x502 `
            -DENABLE_ROSTESTS=0 `
            -DENABLE_ROSAPPS=0

      - name: build ntoskrnl
        run: cmake --build build --target ntoskrnl -- -k 0