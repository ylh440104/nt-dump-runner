name: ros-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - name: install ninja
        run: choco install -y ninja

      - name: install flex bison
        run: |
          curl.exe -O https://svn.reactos.org/storage/vperevertkin/flexbison.7z
          7z x flexbison.7z -o"${{ github.workspace }}\bin" -y
          echo "${{ github.workspace }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "BISON_PKGDATADIR=${{ github.workspace }}\bin\share\bison" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "M4=${{ github.workspace }}\bin\m4.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: clone reactos
        run: git clone --depth 1 https://github.com/reactos/reactos.git src

      - name: apply patch
        shell: bash
        run: |
          cd src
          cat > /tmp/ob.patch <<'PATCH_EOF'
          diff --git a/ntoskrnl/ob/obref.c b/ntoskrnl/ob/obref.c
          index 1448d29..62a0f2d 100644
          --- a/ntoskrnl/ob/obref.c
          +++ b/ntoskrnl/ob/obref.c
          @@ -15,6 +15,8 @@
           #define NDEBUG
           #include <debug.h>
           
          +#define OBJECT_HEADER_CORRUPTION 0x18
          +
           /* PRIVATE FUNCTIONS *********************************************************/
           
           BOOLEAN
          @@ -96,7 +98,28 @@ ObDereferenceObjectEx(IN PVOID Object,
           
               /* Check whether the object can now be deleted. */
               NewCount = InterlockedExchangeAddSizeT(&Header->PointerCount, -Count) - Count;
          -    if (!NewCount) ObpDeferObjectDeletion(Header);
          +    if (NewCount < 1)
          +    {
          +        if (Header->HandleCount != 0)
          +        {
          +            KeBugCheckEx(OBJECT_HEADER_CORRUPTION,
          +                         (ULONG_PTR)Header->Type,
          +                         (ULONG_PTR)Object,
          +                         6,
          +                         (ULONG_PTR)NewCount);
          +        }
          +
          +        if (NewCount < 0)
          +        {
          +            KeBugCheckEx(OBJECT_HEADER_CORRUPTION,
          +                         0,
          +                         (ULONG_PTR)Object,
          +                         5,
          +                         (ULONG_PTR)NewCount);
          +        }
          +
          +        ObpDeferObjectDeletion(Header);
          +    }
           
               /* Return the current count */
               return NewCount;
          PATCH_EOF
          git apply --verbose /tmp/ob.patch
          git diff --stat

      - name: activate msvc
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86
          toolset: '14'

      - name: configure
        run: |
          cmake -S src -B build -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE:FILEPATH=toolchain-msvc.cmake `
            -DARCH:STRING=i386 `
            -DCMAKE_BUILD_TYPE:STRING=Debug `
            -DDLL_EXPORT_VERSION:STRING=0x502 `
            -DENABLE_ROSTESTS=0 `
            -DENABLE_ROSAPPS=0

      - name: build ntoskrnl
        run: cmake --build build --target ntoskrnl -- -k 0