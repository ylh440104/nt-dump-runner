name: ros-map

on:
  workflow_dispatch:
    inputs:
      module:
        description: "module to map (ntoskrnl recommended)"
        required: true
        default: ntoskrnl

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: clone reactos
        run: |
          git clone --depth 1 https://github.com/reactos/reactos.git /tmp/ros
          du -sh /tmp/ros
          ls /tmp/ros/ntoskrnl

      - name: map functions
        env:
          GH_TOKEN: ${{ secrets.OUT_TOKEN }}
          MODULE: ${{ inputs.module }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import urllib.request

          TOKEN = os.environ["GH_TOKEN"]
          MODULE = os.environ["MODULE"]
          DST = "ylh440104/nt-dump-out"
          HEAD = {"Authorization": "token " + TOKEN, "User-Agent": "ros-map",
                  "Accept": "application/vnd.github+json"}

          def get_text(path):
              try:
                  url = "https://raw.githubusercontent.com/%s/main/%s" % (DST, path)
                  req = urllib.request.Request(url, headers=HEAD)
                  with urllib.request.urlopen(req, timeout=180) as r:
                      return r.read().decode("utf-8", "replace")
              except Exception as e:
                  print("get fail", path, e)
                  return ""

          if MODULE == "ntoskrnl":
              sym_path = "symbols.tsv"
          else:
              sym_path = "modules/%s/%s_symbols.tsv" % (MODULE, MODULE)

          symtext = get_text(sym_path)
          decomp_names = []
          for line in symtext.splitlines()[1:]:
              parts = line.split("\t")
              if len(parts) >= 4 and parts[1] == "Function":
                  name = parts[3].split("::")[-1]
                  if re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", name):
                      decomp_names.append(name)
          decomp_set = set(decomp_names)
          print("decomp functions:", len(decomp_set))

          src_funcs = set()
          pat = re.compile(r"^([A-Z][A-Za-z0-9_]{2,})\s*\(")
          bases = ["/tmp/ros/ntoskrnl", "/tmp/ros/sdk/lib", "/tmp/ros/hal"]
          for base in bases:
              for root, dirs, files in os.walk(base):
                  for fn in files:
                      if not fn.endswith((".c", ".cpp")):
                          continue
                      try:
                          with open(os.path.join(root, fn), encoding="utf-8", errors="replace") as f:
                              for line in f:
                                  if line.startswith((" ", "\t", "/", "*", "#", "}")):
                                      continue
                                  m = pat.match(line)
                                  if m:
                                      src_funcs.add(m.group(1))
                      except Exception:
                          pass
          print("reactos functions:", len(src_funcs))

          both = sorted(decomp_set & src_funcs)
          only_dec = sorted(decomp_set - src_funcs)
          print("matched:", len(both), "only-in-binary:", len(only_dec))

          rows = ["status\tfunction"]
          for n in both:
              rows.append("HAVE\t" + n)
          for n in only_dec:
              rows.append("MISSING\t" + n)

          content = "\n".join(rows) + "\n"
          body = {
              "message": "ros map for " + MODULE,
              "content": base64.b64encode(content.encode()).decode(),
              "branch": "main",
          }
          path = "_meta/ros_map_%s.tsv" % MODULE
          url = "https://api.github.com/repos/%s/contents/%s" % (DST, path)
          try:
              req = urllib.request.Request(url, headers=HEAD)
              with urllib.request.urlopen(req, timeout=60) as r:
                  body["sha"] = json.loads(r.read())["sha"]
          except Exception:
              pass
          req = urllib.request.Request(url, data=json.dumps(body).encode(), method="PUT", headers=HEAD)
          with urllib.request.urlopen(req, timeout=120) as r:
              print("pushed", r.status, path, len(rows) - 1, "rows")
          PY