name: smart-test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: fetch
        shell: pwsh
        run: |
          curl.exe -sL https://raw.githubusercontent.com/ylh440104/nt-dump-runner/main/fuzz/smart_test.py -o smart_test.py

      - name: run
        shell: pwsh
        run: python smart_test.py